<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuration / FrameSet</title>
<style>
:root {
  color-scheme: dark;
  --bg:#17191c; --surface:#1e2126; --surface-2:#22262b; --raise:#2a2f36;
  --hair:#2a2f36; --hair-2:#32373f; --text:#ece8df; --text-2:#a9a59b; --text-3:#969188;
  --acc:#c9a45c; --acc-hi:#ddb972; --acc-ink:#1b1a16; --acc-dim:rgba(201,164,92,.13); --acc-line:rgba(201,164,92,.45);
  --ok:#8cc072; --bad:#e06148; --warn:#dca43c; --info:#8b9fe8; --und:#454c55;
  --r:10px; --r-sm:6px; --r-xs:5px; --ctrl:34px; --t:150ms cubic-bezier(.4,0,.2,1);
  --font-ui:"Bricolage Grotesque","SF Pro Text",-apple-system,"Segoe UI",system-ui,sans-serif;
  --font-d:"Bricolage Grotesque",Georgia,serif; --font-m:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.55 var(--font-ui);background:var(--bg);color:var(--text);letter-spacing:-.005em;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:transparent;border:1px solid var(--hair-2);border-radius:var(--r-sm);padding:6px 13px;min-height:var(--ctrl);cursor:pointer;font-weight:550;font-size:13px;transition:color var(--t),background var(--t),border-color var(--t)}
button:hover{background:var(--raise);color:var(--text);border-color:#463c30}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:650}
button.primary:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
button.sm{min-height:28px;padding:3px 10px;font-size:12px;border-radius:var(--r-xs)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{background:var(--surface-2);border:1px solid var(--hair-2);border-radius:var(--r-sm);padding:6px 11px;min-height:var(--ctrl);font-size:13px}
input:focus,select:focus{outline:none;border-color:var(--acc-line);box-shadow:0 0 0 3px var(--acc-dim)}
input::placeholder{color:var(--text-3)}
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{width:220px;flex:none;background:var(--bg);border-right:1px solid var(--hair);padding:18px 12px 14px;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;margin:0 4px 16px;color:var(--text);text-decoration:none}
.brand-mark{display:grid;place-items:center;width:28px;height:28px;color:var(--acc)}
.brand-mark svg{width:24px;height:24px}
.brand b,.brand small{display:block}.brand b{font:700 14px var(--font-d);letter-spacing:.01em}.brand small{margin-top:1px;color:var(--text-3);font:9px var(--font-m);letter-spacing:.08em;text-transform:uppercase}
.sidebar-ds{margin:0 2px 16px;padding:13px 12px 14px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-sm)}
.sidebar-ds-name{font-size:13px;font-weight:700;overflow-wrap:anywhere}.sidebar-ds-stats{display:flex;gap:10px;margin-top:6px;color:var(--text-3);font-size:11px}.sidebar-ds-progress{margin-top:8px}.sidebar-ds-prog{display:flex;align-items:center;gap:8px}.track{height:4px;flex:1;background:var(--hair-2);overflow:hidden;border-radius:2px}.fill{display:block;width:72%;height:100%;background:var(--acc)}.sidebar-ds-prog .lbl{color:var(--text-3);font:9.5px var(--font-m);white-space:nowrap}
.sec{margin:16px 6px 5px;color:var(--text-3);font-size:10px;font-weight:650;letter-spacing:.13em;text-transform:uppercase}.sec:first-of-type{margin-top:0}
.primary-nav{display:flex;flex-direction:column;gap:3px}.primary-nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:36px;padding:8px 10px;border:0;border-radius:var(--r-xs);text-align:left;color:var(--text-2);font-size:13.5px;font-weight:500}.primary-nav button svg{width:16px;height:16px;flex:none;opacity:.8}.primary-nav button:hover{background:var(--surface);color:var(--text)}.primary-nav button.active{background:var(--surface-2);color:var(--text)}.primary-nav button.active:before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2.5px;background:var(--acc);border-radius:0 2px 2px 0}.primary-nav button.active svg{color:var(--acc);opacity:1}
.more-trigger{display:flex;align-items:center;gap:9px;width:100%;margin-top:auto;padding:7px 9px;min-height:32px;border:0;text-align:left;color:var(--text-3)}.more-trigger .k{margin-left:auto;font:10px var(--font-m)}.more-trigger:hover{background:var(--surface);color:var(--text)}
.main{min-width:0;flex:1;display:flex;flex-direction:column;overflow:hidden}.workspacebar{flex:none;min-height:52px;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--hair);background:var(--bg)}.workspace-dataset{width:180px;flex:none;font:12px var(--font-m)}.workspacebar .spacer{flex:1}.workspace-search{width:240px;flex:none;height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--hair-2);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-3)}.workspace-search svg{width:16px;height:16px;flex:none}.workspace-search input{width:100%;height:30px;min-height:0;padding:2px 0;border:0;background:transparent;box-shadow:none}.workspace-search input:focus{box-shadow:none}.workspace-search kbd{font:10px var(--font-m);white-space:nowrap}.workspace-import{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.workspace-import svg{width:15px;height:15px}.workspace-shortcut{width:34px;padding:0;font:12px var(--font-m)}
.pagebar{flex:none;min-height:56px;display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--hair);background:var(--bg)}.pagebar h1{margin:0;font:550 23px/1.1 var(--font-d);letter-spacing:-.02em}.pagebar .sub{color:var(--text-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pagebar .spacer{flex:1}.pagebar .state{color:var(--text-3);font:10px var(--font-m);text-transform:uppercase;letter-spacing:.08em}
.page-body{flex:1;min-height:0;overflow:hidden;padding:20px 24px 24px}.page-body>*{max-width:1440px}
.footbar{flex:none;min-height:38px;display:flex;align-items:center;gap:14px;padding:9px 20px;border-top:1px solid var(--hair);background:var(--bg);color:var(--text-3);font:12px var(--font-m)}.footbar b{color:var(--text-2)}.footbar .distbar{display:flex;width:130px;height:7px;overflow:hidden;border-radius:4px}.distbar i{display:block;height:100%}.distbar .keep{width:51%;background:var(--ok)}.distbar .review{width:18%;background:var(--warn)}.distbar .reject{width:9%;background:var(--bad)}.distbar .undecided{flex:1;background:var(--und)}
/* The following is the only concept-specific surface. */
.config{height:100%;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:16px;max-width:1230px;margin:0 auto}.config-intro{display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{color:var(--text-3);font:700 10px var(--font-m);letter-spacing:.15em;text-transform:uppercase}.config-intro h2{margin:7px 0 0;font:550 28px/1.06 var(--font-d);letter-spacing:-.03em}.config-intro p{margin:7px 0 0;color:var(--text-3);font-size:12px}.setup-count{text-align:right;color:var(--text-3);font:11px var(--font-m);white-space:nowrap}.setup-count strong{display:block;color:var(--text);font-size:15px;font-weight:500}.config-tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--hair-2)}.config-tabs button{min-height:36px;margin-bottom:-1px;padding:7px 14px;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--text-3);font-size:12px}.config-tabs button:hover{background:var(--surface);color:var(--text)}.config-tabs button.active{border-bottom-color:var(--acc);color:var(--text);background:transparent}
.config-layout{min-height:0;display:grid;grid-template-columns:285px minmax(0,1fr);border:1px solid var(--hair-2);background:var(--surface);overflow:hidden}.function-ledger{min-height:0;overflow:auto;border-right:1px solid var(--hair-2);background:var(--surface)}.ledger-heading{padding:14px 16px 12px;border-bottom:1px solid var(--hair)}.ledger-heading strong{display:block;margin-top:5px;font-size:14px;font-weight:600}.ledger-heading span:last-child{display:block;margin-top:3px;color:var(--text-3);font:10px var(--font-m)}.ledger-group{padding:13px 16px 6px;color:var(--text-3);font:10px var(--font-m);letter-spacing:.12em;text-transform:uppercase}.fn-row{width:100%;display:grid;grid-template-columns:7px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px 16px;border:0;border-left:2px solid transparent;border-radius:0;text-align:left}.fn-row:hover{background:var(--surface-2)}.fn-row.active{border-left-color:var(--acc);background:var(--surface-2)}.fn-dot{width:7px;height:7px;border:1px solid var(--hair-2);border-radius:50%}.fn-dot.on{background:var(--ok);border-color:var(--ok)}.fn-dot.built{border-color:var(--info)}.fn-name{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fn-model{display:block;margin-top:2px;color:var(--text-3);font:10px var(--font-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fn-status{color:var(--text-3);font:9px var(--font-m);text-transform:uppercase;white-space:nowrap}.fn-status.on{color:var(--ok)}.fn-status.built{color:var(--info)}
.config-detail{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden;background:var(--bg)}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:17px 20px 14px;border-bottom:1px solid var(--hair)}.detail-head h3{margin:5px 0 0;font:550 21px/1.1 var(--font-d);letter-spacing:-.025em}.detail-head p{max-width:560px;margin:6px 0 0;color:var(--text-3);font-size:11px}.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 7px;border:1px solid var(--hair-2);color:var(--text-3);font:10px var(--font-m);white-space:nowrap}.pill i{width:6px;height:6px;border-radius:50%;background:var(--ok)}.pill.built i{background:var(--info)}.active-implementation{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 20px;border-bottom:1px solid var(--hair);background:var(--surface-2)}.active-implementation .label{color:var(--text-3);font:10px var(--font-m);letter-spacing:.1em;text-transform:uppercase}.active-model-name{margin-top:3px;font-size:15px;font-weight:600}.active-model-name small{margin-left:8px;color:var(--ok);font:10px var(--font-m);font-weight:500;text-transform:uppercase}.active-meta{display:flex;gap:16px;text-align:right}.active-meta span{display:block;color:var(--text-3);font:10px var(--font-m)}.active-meta b{display:block;margin-top:2px;color:var(--text-2);font:11px var(--font-m);font-weight:500}
.models{min-height:0;overflow:auto;padding:16px 20px}.models-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}.models-head strong{font-size:12px}.models-head span{color:var(--text-3);font-size:11px}.model-list{border-top:1px solid var(--hair-2)}.model-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:15px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}.model-row.selected{margin:0 -10px;padding-left:10px;padding-right:10px;background:var(--acc-dim)}.model-select{min-width:0;padding:0;border:0;border-radius:0;text-align:left}.model-select:hover{background:transparent;color:var(--text)}.model-name{display:block;font-size:12px;font-weight:650}.model-meta{display:flex;gap:10px;margin-top:3px;color:var(--text-3);font:10px var(--font-m);flex-wrap:wrap}.model-meta span+span:before{content:"·";margin-right:10px;color:var(--hair-2)}.model-state{color:var(--text-3);font:10px var(--font-m);text-transform:uppercase;white-space:nowrap}.model-state.active{color:var(--ok)}.model-action{min-width:93px}.model-action.active{border-color:rgba(140,192,114,.55);color:var(--ok);cursor:default}.selection-note{margin-top:12px;padding:9px 11px;border-left:2px solid var(--acc);background:var(--surface-2);color:var(--text-3);font-size:11px}.selection-note strong{color:var(--text-2)}.detail-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;border-top:1px solid var(--hair);color:var(--text-3);font-size:10px}.detail-foot strong{color:var(--text-2);font:10px var(--font-m);font-weight:500}
.automation-list,.extension-list{min-height:0;overflow:auto;display:grid;align-content:start;gap:8px;border:1px solid var(--hair-2);padding:14px;background:var(--surface)}.automation-row,.extension-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;padding:15px 16px;border:1px solid var(--hair);background:var(--bg)}.automation-row h3,.extension-row h3{margin:5px 0 3px;font-size:14px;font-weight:600}.automation-row p,.extension-row p{margin:0;color:var(--text-3);font-size:11px}.automation-controls{display:flex;align-items:center;gap:16px}.automation-controls label{display:flex;align-items:center;gap:7px;color:var(--text-3);font:10px var(--font-m);white-space:nowrap}.automation-controls input{width:16px;height:16px;min-height:0;accent-color:var(--acc)}.extension-row{grid-template-columns:38px minmax(0,1fr) auto}.extension-mark{display:grid;place-items:center;width:34px;height:30px;border:1px solid var(--hair-2);color:var(--acc);font:700 10px var(--font-m)}.install.installed{border-color:rgba(140,192,114,.55);color:var(--ok);cursor:default}.notice{padding:10px 11px;border-left:2px solid var(--acc);background:var(--surface-2);color:var(--text-3);font-size:11px}.notice strong{color:var(--text-2)}
@media(max-width:1024px){.sidebar{width:190px}.page-body{padding:18px 16px}.workspace-search{width:200px}.config{max-width:none}.config-layout{grid-template-columns:250px minmax(0,1fr)}}
@media(max-width:760px){body{overflow:auto}.app{height:auto;min-height:100dvh;display:block}.sidebar{width:100%;height:auto;padding:12px;display:block;border-right:0;border-bottom:1px solid var(--hair)}.brand{margin-bottom:12px}.sidebar-ds{margin-bottom:10px}.primary-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.primary-nav button{min-height:32px;padding:6px 8px;font-size:12px}.primary-nav button:nth-child(n+7){display:none}.more-trigger{display:none}.main{min-height:calc(100dvh - 174px);overflow:visible}.workspacebar{flex-wrap:wrap;padding:8px 12px}.workspace-dataset{width:170px}.workspace-search{order:3;width:100%}.workspacebar .spacer{display:none}.pagebar{padding:12px 16px}.pagebar .sub{display:none}.page-body{padding:16px 12px 20px;overflow:visible}.config{height:auto;min-height:0}.config-intro{display:block}.setup-count{text-align:left;margin-top:12px}.config-layout{display:block;overflow:visible}.function-ledger{border-right:0;border-bottom:1px solid var(--hair-2);overflow:visible}.ledger-list{display:flex;overflow:auto}.ledger-heading{padding:12px 14px}.ledger-group{display:none}.fn-row{min-width:185px;border:1px solid var(--hair);border-left:2px solid transparent;padding:9px 10px}.fn-row.active{border-left-color:var(--acc)}.config-detail{min-height:560px}.detail-head{display:block}.detail-head .pill{margin-top:12px}.active-implementation{display:block}.active-meta{margin-top:12px;text-align:left}.models{padding:14px}.model-row{grid-template-columns:minmax(0,1fr) auto;gap:8px}.model-state{display:none}.automation-row,.extension-row{grid-template-columns:minmax(0,1fr) auto;padding:13px}.automation-controls{gap:8px}.automation-controls label{font-size:0}.extension-row{grid-template-columns:34px minmax(0,1fr) auto}.footbar{padding:8px 12px;gap:8px;font-size:10px}.footbar .distbar{width:80px}.footbar span:last-child{display:none}}
@media(max-width:430px){.pagebar h1{font-size:20px}.config-intro h2{font-size:24px}.config-tabs{overflow:auto}.config-tabs button{flex:none;padding-inline:11px}.active-meta{gap:10px}.active-meta span:nth-child(3),.active-meta span:nth-child(4){display:none}.model-meta{display:block}.model-meta span{display:inline}.model-meta span+span:before{margin-right:6px}.model-action{min-width:86px}.footbar .distbar{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Application navigation">
    <a class="brand" href="#dashboard" aria-label="FrameSet home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z" stroke="currentColor" stroke-width="1.8"/><path d="M10 10h4v4h-4z" fill="currentColor"/></svg></span><span><b>FrameSet</b><small>dataset studio</small></span></a>
    <div class="sidebar-ds" aria-label="Active dataset status"><div class="sidebar-ds-name">Product archive</div><div class="sidebar-ds-stats"><span>12,480 images</span><span>14 open issues</span></div><div class="sidebar-ds-progress"><span class="sidebar-ds-prog"><span class="track"><span class="fill"></span></span><span class="lbl">72% decided</span></span></div></div>
    <span class="sec">Workspace</span>
    <nav class="primary-nav" aria-label="Primary navigation">
      <button type="button" data-shell="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Home</button>
      <button type="button" data-shell="Clean"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 20 4-4"/><path d="m8 15 7-7"/><path d="m14 9 2-2 3 3-2 2"/><path d="m4 18 2 2h11"/><path d="M17 16h4"/></svg>Clean</button>
      <button type="button" data-shell="Explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>Explore</button>
      <button type="button" data-shell="Review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg>Review</button>
      <button type="button" data-shell="Annotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Annotate</button>
      <button type="button" data-shell="Find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Find</button>
      <button type="button" data-shell="History"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>History</button>
      <button type="button" data-shell="Publish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Publish</button>
      <button class="active" type="button" data-shell="Config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2" fill="var(--bg)"/><circle cx="15" cy="12" r="2" fill="var(--bg)"/><circle cx="11" cy="17" r="2" fill="var(--bg)"/></svg>Config</button>
    </nav>
    <button class="more-trigger" type="button"><span>More</span><span class="k">?</span></button>
  </aside>
  <div class="main">
    <header class="workspacebar">
      <select class="workspace-dataset" aria-label="Active dataset"><option>Product archive</option><option>Field research</option></select><span class="spacer"></span>
      <label class="workspace-search"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input placeholder="Search in Product archive…" aria-label="Search images"><kbd>⌘K</kbd></label><span class="spacer"></span>
      <button class="primary workspace-import" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span>import images</span></button><button class="workspace-shortcut" type="button" aria-label="Open shortcuts">?</button>
    </header>
    <div class="pagebar"><h1>Configuration</h1><span class="sub">models, rules, and app capabilities</span><span class="spacer"></span><span class="state" id="shellState">local runtime ready</span></div>
    <main class="page-body" id="configInterior"></main>
    <footer class="footbar"><span><b>Product archive</b> · <span>12,480 items</span></span><span class="distbar" aria-label="Dataset decision progress"><i class="keep"></i><i class="review"></i><i class="reject"></i><i class="undecided"></i></span><span><b>14</b> open issues</span><span class="spacer"></span><span>v2.4</span></footer>
  </div>
</div>
<script>
const functions={
 semantic:{group:'Discover',title:'Semantic search',use:'Find related images',description:'Search by visual meaning instead of filenames or folders.',active:'siglip-base',models:[['siglip-base','SigLIP 2 / Base','428 MB','1.1 GB','CPU · 210 ms','Apache-2.0'],['siglip-small','SigLIP 2 / Small','180 MB','620 MB','CPU · 120 ms','Apache-2.0'],['clip-vit-l14','CLIP ViT-L/14','890 MB','2.6 GB','GPU · 80 ms','MIT']]},
 label:{group:'Discover',title:'Auto-label images',use:'Suggest object labels',description:'Suggest objects and scenes for each new image.',active:'florence-base',models:[['florence-base','Florence-2 / Base','1.1 GB','2.4 GB','GPU · 340 ms','MIT'],['moondream','Moondream 2','1.8 GB','3.6 GB','GPU · 410 ms','Apache-2.0']]},
 duplicates:{group:'Curate',title:'Duplicate detection',use:'Keep one of similar files',description:'Find near-identical frames before they add noise.',active:'phash',builtin:true,models:[['phash','Perceptual hash','Built-in','—','CPU · instant','FrameSet']]},
 background:{group:'Curate',title:'Background removal',use:'Create clean cutouts',description:'Remove a distracting background from subject images.',active:'rmbg',models:[['rmbg','RMBG 2.0','176 MB','720 MB','CPU · 680 ms','MIT'],['isnet','IS-Net General Use','168 MB','690 MB','CPU · 620 ms','Apache-2.0']]},
 face:{group:'Protect',title:'Face blur',use:'Protect people in exports',description:'Blur detected faces before an image leaves the workspace.',active:'face-blur',models:[['face-blur','Face detector / Lite','24 MB','180 MB','CPU · 45 ms','BSD-3-Clause']]},
 metadata:{group:'Built-in rules',title:'Metadata cleanup',use:'Remove private metadata',description:'Strip GPS, serial numbers, and other embedded fields.',active:'metadata',builtin:true,models:[['metadata','Built-in metadata rule','Built-in','—','CPU · instant','FrameSet']]},
 export:{group:'Built-in rules',title:'Format conversion',use:'Prepare delivery files',description:'Convert images to a delivery preset format and size.',active:'format',builtin:true,models:[['format','Built-in format rule','Built-in','—','CPU · instant','FrameSet']]}
};
const order=['semantic','label','duplicates','background','face','metadata','export'];
const state={tab:'functions',selected:'semantic',selectedModel:'siglip-base',active:{semantic:'siglip-base',label:'florence-base',duplicates:'phash',background:'rmbg',face:'face-blur',metadata:'metadata',export:'format'},installed:new Set(['siglip-base','florence-base','phash','rmbg','face-blur','metadata','format']),automation:{watch:true,labels:false,cleanup:true},extensions:{raw:true,pack:false}};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function model(key,id){return functions[key].models.find(item=>item[0]===id)}
function setState(text){$('#shellState').textContent=text;$('#shellState').style.color='var(--acc)';window.clearTimeout(setState.timer);setState.timer=window.setTimeout(()=>{$('#shellState').textContent='local runtime ready';$('#shellState').style.color=''},1600)}
function renderLedger(){let group='';$('#functionList')?.remove();const groups=order.map(key=>{const f=functions[key];let heading='';if(f.group!==group){group=f.group;heading=`<div class="ledger-group">${group}</div>`}const active=model(key,state.active[key]);const built=!!f.builtin;return `${heading}<button class="fn-row ${key===state.selected?'active':''}" type="button" data-function="${key}" aria-pressed="${key===state.selected}"><i class="fn-dot ${built?'built':'on'}" aria-hidden="true"></i><span><span class="fn-name">${f.title}</span><span class="fn-model">${built?'built-in':active[1]}</span></span><span class="fn-status ${built?'built':'on'}">${built?'rule':'active'}</span></button>`}).join('');return groups}
function renderFunctionTab(){const f=functions[state.selected],active=model(state.selected,state.active[state.selected]),selected=model(state.selected,state.selectedModel),built=!!f.builtin;return `<div class="config-layout"><aside class="function-ledger" aria-label="Configured functions"><div class="ledger-heading"><span class="eyebrow">Function ledger</span><strong>Image functions</strong><span>7 configured · ${built?'built-in rule':'model-backed'}</span></div><div class="ledger-list">${renderLedger()}</div></aside><section class="config-detail" aria-label="Function and model details"><header class="detail-head"><div><span class="eyebrow">${f.use} · ${built?'BUILT IN':'LOCAL FUNCTION'}</span><h3>${f.title}</h3><p>${f.description}</p></div><span class="pill ${built?'built':''}"><i aria-hidden="true"></i>${built?'no download':'model-backed'}</span></header><div class="active-implementation"><div><span class="label">Active implementation</span><div class="active-model-name">${active[1]} <small>${built?'ready':'running'}</small></div></div><div class="active-meta"><span>size<b>${active[2]}</b></span><span>ram<b>${active[3]}</b></span><span>runtime<b>${active[4]}</b></span><span>license<b>${active[5]}</b></span></div></div><div class="models"><div class="models-head"><strong>${built?'Implementation':'Available models'}</strong><span>${built?'Ships with FrameSet':'Select a row to compare'}</span></div><div class="model-list">${f.models.map(m=>{const activeId=state.active[state.selected]===m[0],chosen=state.selectedModel===m[0],installed=state.installed.has(m[0]);return `<div class="model-row ${chosen?'selected':''}"><button class="model-select" type="button" data-model="${m[0]}" aria-pressed="${chosen}"><span class="model-name">${m[1]}</span><span class="model-meta"><span>${m[2]}</span><span>${m[3]} RAM</span><span>${m[4]}</span><span>${m[5]}</span></span></button><span class="model-state ${activeId?'active':''}">${activeId?'active':chosen?'selected':''}</span><button class="model-action sm ${activeId?'active':''}" type="button" data-use="${m[0]}" ${activeId?'disabled':''}>${activeId?'Active':installed?'Use this model':'Install &amp; use'}</button></div>`}).join('')}</div>${selected&&selected[0]!==active[0]?`<div class="selection-note"><strong>Selected for review:</strong> ${selected[1]} · ${selected[2]} download · active model stays unchanged until you use this model.</div>`:''}</div><footer class="detail-foot"><span>Models run on this device; files are not uploaded.</span><strong>${selected&&selected[0]!==active[0]?'1 pending model change':'all changes saved'}</strong></footer></section></div>`}
function renderAutomation(){return `<div class="automation-list" aria-label="Automation settings"><div class="automation-row"><div><span class="eyebrow">IMPORT FLOW</span><h3>Process new imports</h3><p>Run duplicate detection and metadata cleanup when a folder is added.</p></div><div class="automation-controls"><label>enabled <input type="checkbox" data-automation="watch" ${state.automation.watch?'checked':''}></label></div></div><div class="automation-row"><div><span class="eyebrow">REVIEW FLOW</span><h3>Suggest labels after import</h3><p>Queue Auto-label images for review without changing source files.</p></div><div class="automation-controls"><label>enabled <input type="checkbox" data-automation="labels" ${state.automation.labels?'checked':''}></label></div></div><div class="automation-row"><div><span class="eyebrow">DELIVERY FLOW</span><h3>Prepare delivery exports</h3><p>Apply face blur and the selected format preset before sharing.</p></div><div class="automation-controls"><label>enabled <input type="checkbox" data-automation="cleanup" ${state.automation.cleanup?'checked':''}></label></div></div><div class="notice"><strong>Local schedule.</strong> Automations wait for the app to be open and never run without your permission.</div></div>`}
function renderExtensions(){return `<div class="extension-list" aria-label="Extensions"><div class="extension-row"><div class="extension-mark">RAW</div><div><span class="eyebrow">FILE SUPPORT</span><h3>Camera RAW support</h3><p>Open CR3, NEF, and ARW files in the collection browser.</p></div><button class="install installed sm" type="button" disabled>Installed</button></div><div class="extension-row"><div class="extension-mark">S3</div><div><span class="eyebrow">REMOTE SOURCE</span><h3>S3 archive connector</h3><p>Browse a read-only bucket as a remote dataset source.</p></div><button class="install sm ${state.extensions.raw?'':'installed'}" type="button" data-extension="raw">${state.extensions.raw?'Install':'Installed'}</button></div><div class="extension-row"><div class="extension-mark">PDF</div><div><span class="eyebrow">DELIVERY</span><h3>Contact sheet export</h3><p>Deliver a labeled PDF contact sheet for a review round.</p></div><button class="install sm ${state.extensions.pack?'installed':''}" type="button" data-extension="pack">${state.extensions.pack?'Installed':'Install'}</button></div><div class="notice"><strong>Extensions are isolated.</strong> They add an import or export surface, but cannot replace a built-in rule or send images to a third party.</div></div>`}
function render(){const enabled=Object.values(state.automation).filter(Boolean).length;$('#configInterior').innerHTML=`<div class="config"><header class="config-intro"><div><span class="eyebrow">Configuration</span><h2>Make the useful choice once.</h2><p>Quiet defaults for a local image workflow. One active implementation per function.</p></div><div class="setup-count"><strong>${state.tab==='functions'?'7 functions':state.tab==='automation'?enabled+' enabled':'1 installed'}</strong>${state.tab==='functions'?'4 active · 3 built-in':state.tab==='automation'?'of 3 routines':'2 available'}</div></header><div class="config-tabs" role="tablist" aria-label="Configuration sections"><button class="${state.tab==='functions'?'active':''}" data-tab="functions" role="tab" aria-selected="${state.tab==='functions'}">Functions &amp; Models</button><button class="${state.tab==='automation'?'active':''}" data-tab="automation" role="tab" aria-selected="${state.tab==='automation'}">Automation</button><button class="${state.tab==='extensions'?'active':''}" data-tab="extensions" role="tab" aria-selected="${state.tab==='extensions'}">Extensions</button></div>${state.tab==='functions'?renderFunctionTab():state.tab==='automation'?renderAutomation():renderExtensions()}</div>`;bind()}
function bind(){$$('.config-tabs [data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$$('[data-function]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.function;state.selectedModel=state.active[state.selected];render()});$$('[data-model]').forEach(b=>b.onclick=()=>{state.selectedModel=b.dataset.model;render()});$$('[data-use]').forEach(b=>b.onclick=()=>{const id=b.dataset.use;state.installed.add(id);state.active[state.selected]=id;state.selectedModel=id;setState('changes saved');render()});$$('[data-automation]').forEach(i=>i.onchange=()=>{state.automation[i.dataset.automation]=i.checked;setState('automation updated');render()});$$('[data-extension]').forEach(b=>b.onclick=()=>{state.extensions[b.dataset.extension]=true;setState('extension installed');render()})}
render();
</script>
</body>
</html>
