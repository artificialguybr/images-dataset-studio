<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotate — one clear decision</title>
  <style>
    :root {
      --black: #0b0b0d;
      --ink: #f5f5f2;
      --subtle: #a0a0a3;
      --faint: #69696d;
      --line: #29292d;
      --canvas: #171719;
      --red: #ff453a;
      --red-soft: rgba(255,69,58,.16);
      --green: #32d74b;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--black);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible, [role="button"]:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .shell {
      width: min(1460px, calc(100% - 80px));
      height: 100dvh;
      min-height: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      flex: 0 0 78px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.02em;
    }
    .apple-mark { width: 22px; height: 25px; position: relative; display: inline-block; }
    .apple-mark::before {
      content: "";
      position: absolute;
      width: 17px;
      height: 21px;
      top: 5px;
      left: 1px;
      background: var(--ink);
      border-radius: 47% 53% 48% 50%;
      transform: rotate(-8deg);
    }
    .apple-mark::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 5px;
      top: 0;
      left: 13px;
      background: var(--ink);
      border-radius: 100% 0;
      transform: rotate(-34deg);
    }
    .crumb { color: var(--faint); font-weight: 450; }
    .crumb b { color: var(--subtle); font-weight: 550; }
    .top-meta { display: flex; align-items: center; gap: 26px; }
    .progress-copy {
      color: var(--subtle);
      font-size: 12px;
      letter-spacing: .03em;
      font-variant-numeric: tabular-nums;
    }
    .progress-copy strong { color: var(--ink); font-weight: 600; }
    .exit {
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: var(--subtle);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      transition: border-color .18s, color .18s, background .18s;
    }
    .exit:hover { color: var(--ink); border-color: #55555b; background: #171719; }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: clamp(38px, 5vw, 84px);
      padding: 35px 0 27px;
    }
    .work {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .work-head {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .kicker {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .filename {
      color: var(--faint);
      font: 11px var(--mono);
    }
    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      border: 1px solid var(--line);
      background: var(--canvas);
      overflow: hidden;
    }
    .canvas-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.025);
    }
    .scene {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .canvas-hint {
      position: absolute;
      left: 16px;
      bottom: 14px;
      padding: 6px 9px;
      color: rgba(255,255,255,.66);
      background: rgba(11,11,13,.66);
      font-size: 11px;
      letter-spacing: .02em;
      pointer-events: none;
    }
    .canvas-hint strong { color: var(--ink); font-weight: 600; }
    .annotation-box {
      fill: rgba(255,69,58,.08);
      stroke: var(--red);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
      transition: opacity .2s;
    }
    .annotation-box.is-hidden { opacity: 0; }
    .annotation-label {
      fill: var(--red);
      transition: opacity .2s;
    }
    .annotation-label.is-hidden { opacity: 0; }
    .annotation-label-bg { fill: var(--red); }
    .annotation-label-text {
      fill: #fff;
      font: 600 15px var(--sans);
      letter-spacing: .01em;
    }
    .point-mark {
      fill: var(--red);
      stroke: #fff;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      opacity: 0;
      transition: opacity .2s;
    }
    .point-mark.visible { opacity: 1; }

    .decision {
      min-width: 0;
      align-self: center;
      width: 100%;
      padding-top: 5px;
    }
    .decision-title {
      margin: 0;
      max-width: 320px;
      font-size: clamp(35px, 3vw, 52px);
      line-height: .97;
      letter-spacing: -.07em;
      font-weight: 650;
    }
    .decision-title em { color: var(--red); font-style: normal; }
    .intro {
      margin: 17px 0 0;
      max-width: 285px;
      color: var(--subtle);
      font-size: 14px;
      line-height: 1.45;
    }
    .control-group {
      margin-top: 34px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
    }
    .control-label {
      display: block;
      margin-bottom: 11px;
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .class-list { display: flex; gap: 7px; flex-wrap: wrap; }
    .class-btn, .mode-btn {
      min-height: 35px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--subtle);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      transition: color .18s, border-color .18s, background .18s;
    }
    .class-btn:hover, .mode-btn:hover { color: var(--ink); border-color: #5a5a61; }
    .class-btn.active {
      border-color: var(--red);
      color: var(--ink);
      background: var(--red-soft);
    }
    .class-btn .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 7px;
      border-radius: 50%;
      vertical-align: 1px;
      background: var(--red);
    }
    .mode-list { display: flex; gap: 5px; }
    .mode-btn { min-width: 92px; }
    .mode-btn.active { border-color: var(--ink); color: var(--black); background: var(--ink); }
    .mode-btn span { margin-right: 7px; font-size: 15px; }

    .next-step {
      width: 100%;
      min-height: 57px;
      margin-top: 35px;
      padding: 0 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 0;
      border-radius: 2px;
      background: var(--ink);
      color: var(--black);
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.03em;
      transition: background .18s, transform .18s;
    }
    .next-step:hover { background: #ffb5ae; }
    .next-step:active { transform: translateY(1px); }
    .next-step.saved { background: var(--green); }
    .next-step .arrow { font-size: 25px; font-weight: 400; line-height: 0; }
    .undo {
      display: block;
      margin-top: 14px;
      padding: 3px 0;
      border: 0;
      background: transparent;
      color: var(--subtle);
      cursor: pointer;
      font-size: 12px;
      text-decoration: underline;
      text-decoration-color: #4e4e53;
      text-underline-offset: 4px;
    }
    .undo:hover { color: var(--ink); }
    .status {
      min-height: 20px;
      margin-top: 13px;
      color: var(--faint);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .status.saved { color: var(--green); }

    .bottom {
      flex: 0 0 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 11px;
    }
    .bottom strong { color: var(--subtle); font-weight: 550; }
    .bar {
      width: 250px;
      height: 3px;
      margin-left: 12px;
      display: inline-block;
      vertical-align: middle;
      background: var(--line);
    }
    .bar i { display: block; width: 43%; height: 100%; background: var(--red); transition: width .3s ease; }
    .shortcut { color: var(--faint); font-family: var(--mono); }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .shell { width: min(100% - 36px, 650px); min-height: 100dvh; height: auto; }
      .topbar { height: 66px; flex-basis: 66px; }
      .top-meta { gap: 12px; }
      .progress-copy { font-size: 11px; }
      .crumb { display: none; }
      main { display: block; padding: 29px 0 38px; }
      .canvas-wrap { height: min(62vw, 450px); min-height: 250px; }
      .decision { margin-top: 33px; padding-top: 0; }
      .decision-title { max-width: none; font-size: 47px; }
      .intro { max-width: 430px; }
      .control-group { margin-top: 27px; }
      .next-step { margin-top: 28px; }
      .bottom { min-height: 59px; height: auto; padding: 15px 0; }
      .bar { width: 110px; }
    }
    @media (max-width: 460px) {
      .shell { width: min(100% - 26px, 650px); }
      .work-head { margin-bottom: 11px; }
      .filename { font-size: 10px; }
      .bottom .shortcut { display: none; }
      .bar { width: 88px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="Annotate workspace">
        <span class="apple-mark" aria-hidden="true"></span>
        <span>Annotate</span>
        <span class="crumb">/ <b>summer-street</b></span>
      </div>
      <div class="top-meta">
        <span class="progress-copy"><strong id="progress-number">18</strong> of 42 reviewed</span>
        <button class="exit" type="button" aria-label="Close annotator">×</button>
      </div>
    </header>

    <main>
      <section class="work" aria-labelledby="image-title">
        <div class="work-head">
          <span class="kicker" id="image-title">Image 18</span>
          <span class="filename" id="filename">street_018.jpg</span>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <svg class="scene" id="scene" viewBox="0 0 1000 650" role="img" aria-label="Street scene with one person to label" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#95a6b2"/>
                <stop offset=".55" stop-color="#d4c6ae"/>
                <stop offset="1" stop-color="#e6b36f"/>
              </linearGradient>
              <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#5c5d5b"/>
                <stop offset="1" stop-color="#242426"/>
              </linearGradient>
              <linearGradient id="building" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#343b40"/>
                <stop offset="1" stop-color="#1c2228"/>
              </linearGradient>
              <pattern id="windows" width="62" height="72" patternUnits="userSpaceOnUse">
                <rect width="62" height="72" fill="url(#building)"/>
                <rect x="10" y="12" width="18" height="25" fill="#cda86f" opacity=".52"/>
                <rect x="37" y="12" width="16" height="25" fill="#8e9a9b" opacity=".3"/>
                <rect x="10" y="48" width="18" height="16" fill="#ad7e51" opacity=".28"/>
                <rect x="37" y="48" width="16" height="16" fill="#bdc2b5" opacity=".2"/>
              </pattern>
              <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
            </defs>
            <rect width="1000" height="650" fill="url(#sky)"/>
            <circle cx="792" cy="143" r="70" fill="#ffd38b" opacity=".66" filter="url(#soft)"/>
            <path d="M0 314 120 228 225 314 348 185 526 314 652 215 804 314 916 252 1000 305V390H0Z" fill="#8b837a" opacity=".64"/>
            <path d="M0 340h1000v150H0z" fill="url(#windows)"/>
            <path d="M0 383h1000v18H0z" fill="#282e33" opacity=".9"/>
            <path d="M0 410h1000v240H0z" fill="url(#road)"/>
            <path d="M0 410h1000" stroke="#e0b57a" stroke-width="4" opacity=".58"/>
            <path d="M60 486h209M355 486h198M696 486h246" stroke="#cfc7af" stroke-width="7" opacity=".5"/>
            <path d="M58 548h126M235 548h193M530 548h180M820 548h134" stroke="#b8b4a9" stroke-width="5" opacity=".3"/>
            <path d="M0 391h1000" stroke="#1c2224" stroke-width="4" opacity=".8"/>
            <g opacity=".9">
              <path d="M120 384v-99M116 302l-37-33M118 313l37-40M118 285l5-51" stroke="#353739" stroke-width="7"/>
              <path d="M842 385v-90M838 304l-35-29M841 322l40-39" stroke="#37393a" stroke-width="7"/>
              <circle cx="117" cy="264" r="33" fill="#455247"/><circle cx="155" cy="278" r="38" fill="#4a594c"/><circle cx="79" cy="278" r="27" fill="#3d4d45"/>
              <circle cx="842" cy="273" r="31" fill="#4b5749"/><circle cx="881" cy="282" r="42" fill="#3b4a40"/><circle cx="801" cy="287" r="25" fill="#536052"/>
            </g>
            <g id="person" transform="translate(572 305)">
              <ellipse cx="42" cy="278" rx="71" ry="14" fill="#171719" opacity=".48"/>
              <circle cx="43" cy="17" r="22" fill="#b9784d"/>
              <path d="M24 13c4-25 35-31 49-8-15-3-31 1-49 8Z" fill="#26272a"/>
              <path d="M20 53c13-16 36-20 52-2l16 93H10Z" fill="#d5dedb"/>
              <path d="m27 70-31 80 16 8 40-69M70 69l28 74-15 7-40-66" fill="#c8d1ce"/>
              <path d="M28 146h26l-4 96H21ZM58 146h24l18 94-29 3Z" fill="#20282d"/>
              <path d="M17 241h39v13H12ZM71 239h31v14H68Z" fill="#1b1d20"/>
              <path d="m15 83-38 41" stroke="#b9784d" stroke-width="13" stroke-linecap="round"/>
              <path d="m91 83 38 49" stroke="#b9784d" stroke-width="13" stroke-linecap="round"/>
              <path d="M123 132l21 21" stroke="#232629" stroke-width="8" stroke-linecap="round"/>
            </g>
            <g id="box-group">
              <rect class="annotation-box" id="bbox" x="555" y="303" width="185" height="272" rx="1"/>
              <g class="annotation-label" id="label-tag" transform="translate(555 277)">
                <rect class="annotation-label-bg" width="92" height="28" rx="2"/>
                <text class="annotation-label-text" x="11" y="19" id="label-text">person</text>
              </g>
            </g>
            <circle class="point-mark" id="point-mark" cx="648" cy="420" r="11"/>
          </svg>
          <div class="canvas-hint"><strong id="canvas-hint-strong">Box</strong> mode · drag or click the subject</div>
        </div>
      </section>

      <section class="decision" aria-labelledby="decision-title">
        <p class="kicker">Make one choice</p>
        <h1 class="decision-title" id="decision-title">What is<br><em>here?</em></h1>
        <p class="intro">Name the subject, choose the mark, then continue. Nothing else is required.</p>

        <div class="control-group">
          <span class="control-label">Class</span>
          <div class="class-list" role="group" aria-label="Choose class">
            <button class="class-btn active" type="button" data-class="person"><span class="dot"></span>person</button>
            <button class="class-btn" type="button" data-class="vehicle">vehicle</button>
            <button class="class-btn" type="button" data-class="other">other</button>
          </div>
        </div>
        <div class="control-group">
          <span class="control-label">Mark as</span>
          <div class="mode-list" role="group" aria-label="Choose marking type">
            <button class="mode-btn active" type="button" data-mode="box"><span aria-hidden="true">□</span>Box</button>
            <button class="mode-btn" type="button" data-mode="point"><span aria-hidden="true">·</span>Point</button>
          </div>
        </div>

        <button class="next-step" id="save-next" type="button"><span id="save-label">Save &amp; next</span><span class="arrow" id="save-arrow" aria-hidden="true">→</span></button>
        <button class="undo" id="undo" type="button">Undo last mark</button>
        <div class="status" id="status" aria-live="polite">Ready when you are.</div>
      </section>
    </main>

    <footer class="bottom">
      <span><strong id="footer-progress">43%</strong> complete <i class="bar" aria-hidden="true"><i id="progress-bar"></i></i></span>
      <span class="shortcut">⌘ ↵ &nbsp; save and next</span>
    </footer>
  </div>

  <script>
    const state = { index: 18, total: 42, cls: 'person', mode: 'box', saved: false, previous: null };
    const bbox = document.getElementById('bbox');
    const labelTag = document.getElementById('label-tag');
    const labelText = document.getElementById('label-text');
    const pointMark = document.getElementById('point-mark');
    const canvas = document.getElementById('scene');
    const canvasWrap = document.getElementById('canvas-wrap');
    const save = document.getElementById('save-next');
    const status = document.getElementById('status');

    function setClass(value) {
      state.previous = { cls: state.cls, mode: state.mode };
      state.cls = value;
      document.querySelectorAll('.class-btn').forEach(button => {
        const active = button.dataset.class === value;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', active);
      });
      labelText.textContent = value;
      status.textContent = value + ' selected. Ready to mark.';
    }
    function setMode(value) {
      state.previous = { cls: state.cls, mode: state.mode };
      state.mode = value;
      const point = value === 'point';
      bbox.classList.toggle('is-hidden', point);
      labelTag.classList.toggle('is-hidden', point);
      pointMark.classList.toggle('visible', point);
      document.querySelectorAll('.mode-btn').forEach(button => {
        const active = button.dataset.mode === value;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', active);
      });
      document.getElementById('canvas-hint-strong').textContent = point ? 'Point' : 'Box';
      status.textContent = (point ? 'Point' : 'Box') + ' mode selected.';
    }
    function updateProgress() {
      const percent = Math.round((state.index / state.total) * 100);
      document.getElementById('progress-number').textContent = state.index;
      document.getElementById('footer-progress').textContent = percent + '%';
      document.getElementById('progress-bar').style.width = percent + '%';
      document.getElementById('image-title').textContent = 'Image ' + state.index;
      document.getElementById('filename').textContent = 'street_' + String(state.index).padStart(3, '0') + '.jpg';
    }
    document.querySelectorAll('.class-btn').forEach(button => button.addEventListener('click', () => setClass(button.dataset.class)));
    document.querySelectorAll('.mode-btn').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
    canvas.addEventListener('click', event => {
      if (state.mode !== 'point') {
        status.textContent = 'Subject boxed. Save when it looks right.';
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 1000;
      const y = ((event.clientY - rect.top) / rect.height) * 650;
      pointMark.setAttribute('cx', x.toFixed(1));
      pointMark.setAttribute('cy', y.toFixed(1));
      status.textContent = 'Point placed. Save when it looks right.';
    });
    document.getElementById('undo').addEventListener('click', () => {
      if (state.previous) {
        const prior = state.previous;
        state.previous = null;
        setClass(prior.cls);
        setMode(prior.mode);
        status.textContent = 'Last change undone.';
      } else {
        status.textContent = 'Nothing to undo yet.';
      }
    });
    save.addEventListener('click', () => {
      if (state.saved) return;
      state.saved = true;
      save.classList.add('saved');
      document.getElementById('save-label').textContent = 'Saved — next image';
      document.getElementById('save-arrow').textContent = '✓';
      status.classList.add('saved');
      status.textContent = 'Saved. Moving to image ' + Math.min(state.index + 1, state.total) + '.';
      window.setTimeout(() => {
        state.index = state.index < state.total ? state.index + 1 : 1;
        state.saved = false;
        save.classList.remove('saved');
        document.getElementById('save-label').textContent = 'Save & next';
        document.getElementById('save-arrow').textContent = '→';
        status.classList.remove('saved');
        status.textContent = 'Ready when you are.';
        updateProgress();
      }, 650);
    });
    document.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') save.click();
    });
    document.querySelector('.exit').addEventListener('click', () => {
      status.textContent = 'Progress saved locally.';
    });
    document.querySelectorAll('.class-btn, .mode-btn').forEach(button => button.setAttribute('aria-pressed', button.classList.contains('active')));
    updateProgress();
  </script>
</body>
</html>
